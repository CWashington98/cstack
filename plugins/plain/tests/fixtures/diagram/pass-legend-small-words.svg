<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="t d">
  <title id="t">A small test diagram</title>
  <desc id="d">One box that says hello.</desc>
  <rect x="0" y="0" width="400" height="240" fill="#0b0f17"/>
  <rect x="20" y="30" width="160" height="70" rx="8" fill="#151b26" stroke="#5ea8ff" stroke-width="2"/>
  <text x="100" y="71" text-anchor="middle" fill="#f2f5f9" font-size="18">Passing</text>
  <rect x="220" y="30" width="160" height="70" rx="8" fill="#151b26" stroke="#f2994a" stroke-width="2"/>
  <text x="300" y="71" text-anchor="middle" fill="#f2f5f9" font-size="18">Failing</text>
  <g class="legend">
    <rect x="20" y="170" width="14" height="14" fill="#5ea8ff"/>
    <text x="42" y="182" fill="#9aa5b6" font-size="12">Blue edge: the check passed</text>
    <rect x="220" y="170" width="14" height="14" fill="#f2994a"/>
    <text x="242" y="182" fill="#9aa5b6" font-size="12">Orange edge: it failed</text>
  </g>
</svg>
