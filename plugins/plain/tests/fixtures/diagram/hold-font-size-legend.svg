<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-labelledby="t d">
  <title id="t">A small test diagram</title>
  <desc id="d">One box that says hello.</desc>
  <rect x="0" y="0" width="400" height="200" fill="#0b0f17"/>
  <rect x="40" y="20" width="200" height="80" rx="8" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
  <text x="140" y="66" text-anchor="middle" fill="#f2f5f9" font-size="18">Say hello</text>
  <g id="legend">
    <text x="40" y="160" fill="#9aa5b6" font-size="11">Gray edge: an ordinary step</text>
  </g>
</svg>
