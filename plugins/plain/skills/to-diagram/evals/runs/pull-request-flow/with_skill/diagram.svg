<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 400" width="1260" height="400" role="img" aria-labelledby="diagram-title diagram-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="diagram-title">How a pull request goes from spec to merge</title>
  <desc id="diagram-desc">Six steps from left to right. The owner approves a spec. An agent builds it, tests first. Two reviewers check it. The owner tries it in a preview build. It merges to staging, and later staging merges to main. A problem found by a reviewer sends the work back to the build step.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6c788c"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2994a"/></marker>
  </defs>
  <rect x="0" y="0" width="1260" height="400" fill="#0b0f17"/>
  <text x="40" y="56" fill="#f2f5f9" font-size="24" font-weight="600">How a pull request goes from spec to merge</text>
  <g>
    <rect x="40" y="100" width="160" height="120" rx="10" fill="#202837" stroke="#c49bff" stroke-width="2"/>
    <text x="120" y="136" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Owner approves</text>
    <text x="120" y="160" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">the spec</text>
    <text x="120" y="188" text-anchor="middle" fill="#9aa5b6" font-size="15">a written spec</text>
  </g>
  <g>
    <rect x="244" y="100" width="160" height="120" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="324" y="136" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Agent builds</text>
    <text x="324" y="170" text-anchor="middle" fill="#9aa5b6" font-size="15">tests come first</text>
  </g>
  <g>
    <rect x="448" y="100" width="160" height="120" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="528" y="136" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Two reviewers</text>
    <text x="528" y="160" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">check it</text>
    <text x="528" y="188" text-anchor="middle" fill="#9aa5b6" font-size="15">Karen and a second</text>
    <text x="528" y="208" text-anchor="middle" fill="#9aa5b6" font-size="15">automated reviewer</text>
  </g>
  <g>
    <rect x="652" y="100" width="160" height="120" rx="10" fill="#202837" stroke="#c49bff" stroke-width="2"/>
    <text x="732" y="136" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Owner tries it</text>
    <text x="732" y="170" text-anchor="middle" fill="#9aa5b6" font-size="15">in a preview build</text>
  </g>
  <g>
    <rect x="856" y="100" width="160" height="120" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="936" y="136" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Merges to</text>
    <text x="936" y="160" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">staging branch</text>
  </g>
  <g>
    <rect x="1060" y="100" width="160" height="120" rx="10" fill="#202837" stroke="#5ea8ff" stroke-width="2"/>
    <text x="1140" y="136" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Staging merges</text>
    <text x="1140" y="160" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">to main</text>
    <text x="1140" y="188" text-anchor="middle" fill="#9aa5b6" font-size="15">later, in a batch</text>
  </g>
  <line x1="200" y1="160" x2="240" y2="160" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="404" y1="160" x2="444" y2="160" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="608" y1="160" x2="648" y2="160" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="812" y1="160" x2="852" y2="160" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1016" y1="160" x2="1056" y2="160" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M528,220 C528,290 324,290 324,226" fill="none" stroke="#f2994a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
  <text x="426" y="316" text-anchor="middle" fill="#f2994a" font-size="15">A reviewer finds a problem: back to build</text>
  <g class="legend">
    <rect x="40" y="357" width="16" height="16" rx="3" fill="#202837" stroke="#c49bff" stroke-width="2"/>
    <text x="66" y="371" fill="#9aa5b6" font-size="14">Purple edge: the owner decides</text>
    <rect x="330" y="357" width="16" height="16" rx="3" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="356" y="371" fill="#9aa5b6" font-size="14">Grey edge: agents and tools work</text>
    <line x1="650" y1="365" x2="682" y2="365" stroke="#f2994a" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="692" y="371" fill="#9aa5b6" font-size="14">Orange dashes: going back a step</text>
  </g>
</svg>