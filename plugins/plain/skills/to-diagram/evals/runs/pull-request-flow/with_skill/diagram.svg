<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="diagram-title diagram-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="diagram-title">How a pull request goes from spec to merge</title>
  <desc id="diagram-desc">The owner approves a written spec, an agent builds it with tests first, and two reviewers check it. If either finds a problem, it goes back to the build step. After both pass, the owner tries a preview build, the change merges to the staging branch, and later staging merges to the main branch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c788c"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2994a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="#0b0f17"/>

  <text x="40" y="40" fill="#f2f5f9" font-size="24" font-weight="600">How a pull request goes from spec to merge</text>

  <g>
    <rect x="40" y="170" width="180" height="96" rx="10" fill="#151b26" stroke="#c49bff" stroke-width="2"/>
    <text x="130" y="212" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Approve the spec</text>
    <text x="130" y="238" text-anchor="middle" fill="#9aa5b6" font-size="15">owner signs off</text>
  </g>
  <g>
    <rect x="272" y="170" width="180" height="96" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="362" y="212" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Build it</text>
    <text x="362" y="238" text-anchor="middle" fill="#9aa5b6" font-size="15">agent, tests first</text>
  </g>
  <rect x="504" y="150" width="412" height="136" rx="12" fill="#202837" stroke="#6c788c" stroke-width="2"/>
  <g>
    <rect x="520" y="170" width="180" height="96" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="610" y="212" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Karen reviews</text>
    <text x="610" y="238" text-anchor="middle" fill="#9aa5b6" font-size="15">automated reviewer</text>
  </g>
  <g>
    <rect x="720" y="170" width="180" height="96" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="810" y="212" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Second AI reviews</text>
    <text x="810" y="238" text-anchor="middle" fill="#9aa5b6" font-size="15">separate check</text>
  </g>

  <g>
    <rect x="40" y="370" width="180" height="96" rx="10" fill="#151b26" stroke="#c49bff" stroke-width="2"/>
    <text x="130" y="412" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Try the preview</text>
    <text x="130" y="438" text-anchor="middle" fill="#9aa5b6" font-size="15">owner tests it</text>
  </g>
  <g>
    <rect x="272" y="370" width="180" height="96" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="362" y="412" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Merge to staging</text>
    <text x="362" y="438" text-anchor="middle" fill="#9aa5b6" font-size="15">the test branch</text>
  </g>
  <g>
    <rect x="504" y="370" width="180" height="96" rx="10" fill="#202837" stroke="#5ea8ff" stroke-width="2"/>
    <text x="594" y="412" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Merge to main</text>
    <text x="594" y="438" text-anchor="middle" fill="#9aa5b6" font-size="15">later, from staging</text>
  </g>

  <line x1="220" y1="218" x2="268" y2="218" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="452" y1="218" x2="500" y2="218" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M710,286 C710,330 130,330 130,364" fill="none" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="350" text-anchor="middle" fill="#f2f5f9" font-size="15">Both reviewers pass it</text>
  <line x1="220" y1="418" x2="268" y2="418" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="452" y1="418" x2="500" y2="418" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M710,150 C710,90 362,90 362,164" fill="none" stroke="#f2994a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
  <text x="536" y="84" text-anchor="middle" fill="#f2994a" font-size="15">A reviewer finds a problem: back to build</text>

  <g class="legend">
    <line x1="40" y1="526" x2="72" y2="526" stroke="#c49bff" stroke-width="2"/>
    <text x="82" y="531" fill="#9aa5b6" font-size="14">Purple edge: the owner decides</text>
    <line x1="330" y1="526" x2="362" y2="526" stroke="#f2994a" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="372" y="531" fill="#9aa5b6" font-size="14">Orange dashes: going back a step</text>
    <line x1="650" y1="526" x2="682" y2="526" stroke="#5ea8ff" stroke-width="2"/>
    <text x="692" y="531" fill="#9aa5b6" font-size="14">Blue edge: the finish line</text>
  </g>
</svg>
