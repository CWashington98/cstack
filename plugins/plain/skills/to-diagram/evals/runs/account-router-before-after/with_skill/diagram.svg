<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="diagram-title diagram-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="diagram-title">Account router, before and after</title>
  <desc id="diagram-desc">Two columns. Before: a new session picks whichever of the two accounts has lower usage. After: the router skips a locked account and one near its 5-hour limit. It treats a meter reading over 12 hours old as unknown. Then it picks the account whose weekly allowance resets soonest.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c788c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="610" fill="#0b0f17"/>
  <text x="40" y="56" fill="#f2f5f9" font-size="24" font-weight="600">Which Claude account a new session starts on</text>
  <g>
    <rect x="40" y="90" width="420" height="460" rx="14" fill="#202837" stroke="#6c788c" stroke-width="2"/>
    <text x="64" y="128" fill="#f2994a" font-size="20" font-weight="600">Before</text>
    <rect x="64" y="152" width="372" height="56" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="250" y="186" text-anchor="middle" fill="#f2f5f9" font-size="18">New session starts</text>
    <rect x="64" y="240" width="372" height="56" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="250" y="274" text-anchor="middle" fill="#f2f5f9" font-size="18">Compare usage of both accounts</text>
    <rect x="64" y="328" width="372" height="56" rx="10" fill="#151b26" stroke="#f2994a" stroke-width="2"/>
    <text x="250" y="362" text-anchor="middle" fill="#f2f5f9" font-size="18">Pick the lower usage</text>
    <line x1="250" y1="208" x2="250" y2="236" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="250" y1="296" x2="250" y2="324" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="500" y="90" width="420" height="460" rx="14" fill="#202837" stroke="#6c788c" stroke-width="2"/>
    <text x="524" y="128" fill="#5ea8ff" font-size="20" font-weight="600">After</text>
    <rect x="524" y="152" width="372" height="56" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="710" y="186" text-anchor="middle" fill="#f2f5f9" font-size="18">New session starts</text>
    <line x1="710" y1="208" x2="710" y2="228" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="524" y="232" width="372" height="56" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="710" y="266" text-anchor="middle" fill="#f2f5f9" font-size="18">Skip any locked account</text>
    <line x1="710" y1="288" x2="710" y2="308" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="524" y="312" width="372" height="56" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="710" y="346" text-anchor="middle" fill="#f2f5f9" font-size="18">Skip account near 5-hour limit</text>
    <line x1="710" y1="368" x2="710" y2="388" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="524" y="392" width="372" height="56" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="710" y="426" text-anchor="middle" fill="#f2f5f9" font-size="18">Meter over 12 hours old: unknown</text>
    <line x1="710" y1="448" x2="710" y2="468" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="524" y="472" width="372" height="56" rx="10" fill="#151b26" stroke="#5ea8ff" stroke-width="2"/>
    <text x="710" y="506" text-anchor="middle" fill="#f2f5f9" font-size="18">Pick the soonest weekly reset</text>
  </g>
  <g class="legend">
    <rect x="40" y="572" width="28" height="18" rx="4" fill="#151b26" stroke="#f2994a" stroke-width="2"/>
    <text x="78" y="586" fill="#9aa5b6" font-size="14">Orange edge: the old rule</text>
    <rect x="300" y="572" width="28" height="18" rx="4" fill="#151b26" stroke="#5ea8ff" stroke-width="2"/>
    <text x="338" y="586" fill="#9aa5b6" font-size="14">Blue edge: the new rule</text>
  </g>
</svg>
