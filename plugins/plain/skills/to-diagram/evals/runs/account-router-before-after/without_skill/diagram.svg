<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect width="960" height="620" fill="#ffffff"/>
<text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Account router: which Claude subscription a new session starts on</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>

<text x="230" y="70" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a1c1c">BEFORE</text>
<rect x="30" y="85" width="400" height="60" rx="8" fill="#f4f4f4" stroke="#555"/>
<text x="230" y="110" text-anchor="middle">New Claude Code session starts</text>
<text x="230" y="130" text-anchor="middle" fill="#555">two accounts: A and B</text>
<line x1="230" y1="145" x2="230" y2="195" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="195" width="400" height="80" rx="8" fill="#fdecec" stroke="#8a1c1c"/>
<text x="230" y="225" text-anchor="middle" font-weight="bold">Compare usage on A and B</text>
<text x="230" y="250" text-anchor="middle">Pick the account with the LOWER usage</text>
<line x1="230" y1="275" x2="230" y2="325" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="325" width="400" height="50" rx="8" fill="#f4f4f4" stroke="#555"/>
<text x="230" y="355" text-anchor="middle">Session starts on that account</text>
<text x="230" y="420" text-anchor="middle" fill="#8a1c1c" font-size="13">Not checked: locked accounts, near the 5-hour limit,</text>
<text x="230" y="440" text-anchor="middle" fill="#8a1c1c" font-size="13">stale meter readings, or when the weekly allowance resets.</text>

<line x1="480" y1="70" x2="480" y2="590" stroke="#bbb" stroke-dasharray="6 6"/>

<text x="720" y="70" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c6b2e">AFTER</text>
<rect x="520" y="85" width="400" height="50" rx="8" fill="#f4f4f4" stroke="#555"/>
<text x="720" y="115" text-anchor="middle">New Claude Code session starts</text>
<line x1="720" y1="135" x2="720" y2="160" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="520" y="160" width="400" height="90" rx="8" fill="#fff8e1" stroke="#b07a00"/>
<text x="720" y="183" text-anchor="middle" font-weight="bold">Step 1: read each account's meters</text>
<text x="720" y="205" text-anchor="middle">A meter reading older than 12 hours</text>
<text x="720" y="225" text-anchor="middle">counts as UNKNOWN</text>
<line x1="720" y1="250" x2="720" y2="275" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="520" y="275" width="400" height="110" rx="8" fill="#fff8e1" stroke="#b07a00"/>
<text x="720" y="298" text-anchor="middle" font-weight="bold">Step 2: skip an account if it is</text>
<text x="720" y="323" text-anchor="middle">locked, or</text>
<text x="720" y="345" text-anchor="middle">close to its 5-hour usage limit</text>
<text x="720" y="370" text-anchor="middle" fill="#555" font-size="13">(who remains is the eligible set)</text>
<line x1="720" y1="385" x2="720" y2="410" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="520" y="410" width="400" height="80" rx="8" fill="#e8f5ec" stroke="#1c6b2e"/>
<text x="720" y="437" text-anchor="middle" font-weight="bold">Step 3: of the rest, pick the account</text>
<text x="720" y="460" text-anchor="middle" font-weight="bold">whose WEEKLY allowance resets SOONEST</text>
<line x1="720" y1="490" x2="720" y2="515" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="520" y="515" width="400" height="50" rx="8" fill="#f4f4f4" stroke="#555"/>
<text x="720" y="545" text-anchor="middle">Session starts on that account</text>
<text x="720" y="590" text-anchor="middle" fill="#1c6b2e" font-size="13">Unused weekly allowance is spent before it expires.</text>
</svg>
