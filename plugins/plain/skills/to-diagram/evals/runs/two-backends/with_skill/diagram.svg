<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="diagram-title diagram-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="diagram-title">Two separate backends and the one-way export</title>
  <desc id="diagram-desc">Two groups side by side. The clinical backend holds real patient data and serves the patient app and provider portal. The labeling backend holds anonymized recordings that outside cardiologists rate. They never call each other. An export script copies anonymized recordings from the clinical side to the labeling side, in one direction only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c788c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#0b0f17"/>
  <text x="40" y="56" fill="#f2f5f9" font-size="24" font-weight="600">Two backends, kept apart</text>
  <g>
    <rect x="40" y="96" width="340" height="300" rx="14" fill="#202837" stroke="#6c788c" stroke-width="2"/>
    <text x="64" y="134" fill="#5ea8ff" font-size="20" font-weight="600">Clinical backend</text>
    <text x="64" y="158" fill="#9aa5b6" font-size="15">real patient data</text>
    <rect x="64" y="186" width="292" height="76" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="210" y="219" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Patient and provider apps</text>
    <text x="210" y="243" text-anchor="middle" fill="#9aa5b6" font-size="15">the only users</text>
    <rect x="64" y="290" width="292" height="76" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="210" y="323" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Patient records, recordings</text>
    <text x="210" y="347" text-anchor="middle" fill="#9aa5b6" font-size="15">real names</text>
  </g>
  <g>
    <rect x="580" y="96" width="340" height="300" rx="14" fill="#202837" stroke="#6c788c" stroke-width="2"/>
    <text x="604" y="134" fill="#3ccbd3" font-size="20" font-weight="600">Labeling backend</text>
    <text x="604" y="158" fill="#9aa5b6" font-size="15">anonymized data only</text>
    <rect x="604" y="186" width="292" height="76" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="750" y="219" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Labeling app</text>
    <text x="750" y="243" text-anchor="middle" fill="#9aa5b6" font-size="15">outside cardiologists rate</text>
    <rect x="604" y="290" width="292" height="76" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="750" y="323" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Anonymized recordings</text>
    <text x="750" y="347" text-anchor="middle" fill="#9aa5b6" font-size="15">no names</text>
  </g>
  <text x="480" y="216" text-anchor="middle" fill="#f2994a" font-size="18" font-weight="600">No calls</text>
  <text x="480" y="240" text-anchor="middle" fill="#f2994a" font-size="18" font-weight="600">either way</text>
    <rect x="400" y="290" width="160" height="76" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="480" y="323" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Export script</text>
    <text x="480" y="347" text-anchor="middle" fill="#9aa5b6" font-size="15">copies one way</text>
  <line x1="356" y1="328" x2="400" y2="328" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="328" x2="604" y2="328" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="436" fill="#9aa5b6" font-size="15">The export script is the only link: it copies anonymized recordings from clinical to labeling.</text>
</svg>
