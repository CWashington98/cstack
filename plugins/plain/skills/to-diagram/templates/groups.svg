<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="diagram-title diagram-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Template: boxes in groups. Each group is a raised panel with a colored
       heading; boxes inside are ordinary surface boxes. The heading words name
       the group, so the color is never the only clue.
       Every color here comes from ../palette.json. -->
  <title id="diagram-title">The two halves of the shop and the one link between them</title>
  <desc id="diagram-desc">Two groups side by side. The shop front holds the product pages and the checkout. The back office holds the shipping jobs and the orders database. The only link between them is the checkout sending each order to the orders database.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c788c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="#0b0f17"/>

  <text x="40" y="56" fill="#f2f5f9" font-size="24" font-weight="600">The two halves of the shop</text>

  <g>
    <rect x="40" y="96" width="420" height="300" rx="14" fill="#202837" stroke="#6c788c" stroke-width="2"/>
    <text x="64" y="134" fill="#c49bff" font-size="20" font-weight="600">Shop front</text>
    <text x="64" y="158" fill="#9aa5b6" font-size="15">what customers see</text>
    <rect x="64" y="186" width="372" height="76" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="250" y="219" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Product pages</text>
    <text x="250" y="243" text-anchor="middle" fill="#9aa5b6" font-size="15">read only</text>
    <rect x="64" y="290" width="372" height="76" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="250" y="323" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Checkout</text>
    <text x="250" y="347" text-anchor="middle" fill="#9aa5b6" font-size="15">takes the payment</text>
  </g>

  <g>
    <rect x="500" y="96" width="420" height="300" rx="14" fill="#202837" stroke="#6c788c" stroke-width="2"/>
    <text x="524" y="134" fill="#3ccbd3" font-size="20" font-weight="600">Back office</text>
    <text x="524" y="158" fill="#9aa5b6" font-size="15">what staff run</text>
    <rect x="524" y="186" width="372" height="76" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="710" y="219" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Shipping jobs</text>
    <text x="710" y="243" text-anchor="middle" fill="#9aa5b6" font-size="15">run every hour</text>
    <rect x="524" y="290" width="372" height="76" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="710" y="323" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Orders database</text>
    <text x="710" y="347" text-anchor="middle" fill="#9aa5b6" font-size="15">one row per order</text>
  </g>

  <line x1="436" y1="328" x2="520" y2="328" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="436" fill="#9aa5b6" font-size="15">The arrow is the only link: the checkout sends each order to the orders database.</text>
</svg>
