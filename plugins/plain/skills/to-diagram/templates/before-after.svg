<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="diagram-title diagram-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Template: before and after, or any two things side by side.
       For a comparison of two options, rename the headings.
       Every color here comes from ../palette.json. -->
  <title id="diagram-title">Support requests before and after sorting by team</title>
  <desc id="diagram-desc">Two columns. Before: every request went into one shared queue and waited behind everyone else. After: every request is sorted by team first, so it lands in that team's own queue.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c788c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="#0b0f17"/>

  <text x="40" y="56" fill="#f2f5f9" font-size="24" font-weight="600">Support requests, before and after</text>

  <g>
    <rect x="40" y="90" width="420" height="320" rx="14" fill="#202837" stroke="#6c788c" stroke-width="2"/>
    <text x="64" y="128" fill="#f2994a" font-size="20" font-weight="600">Before</text>
    <rect x="64" y="152" width="372" height="56" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="250" y="186" text-anchor="middle" fill="#f2f5f9" font-size="18">Every request</text>
    <rect x="64" y="240" width="372" height="56" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="250" y="274" text-anchor="middle" fill="#f2f5f9" font-size="18">One shared queue</text>
    <rect x="64" y="328" width="372" height="56" rx="10" fill="#151b26" stroke="#f2994a" stroke-width="2"/>
    <text x="250" y="362" text-anchor="middle" fill="#f2f5f9" font-size="18">Waits behind everyone</text>
    <line x1="250" y1="208" x2="250" y2="236" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="250" y1="296" x2="250" y2="324" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="500" y="90" width="420" height="320" rx="14" fill="#202837" stroke="#6c788c" stroke-width="2"/>
    <text x="524" y="128" fill="#5ea8ff" font-size="20" font-weight="600">After</text>
    <rect x="524" y="152" width="372" height="56" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="710" y="186" text-anchor="middle" fill="#f2f5f9" font-size="18">Every request</text>
    <rect x="524" y="240" width="372" height="56" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="710" y="274" text-anchor="middle" fill="#f2f5f9" font-size="18">Sorted by team</text>
    <rect x="524" y="328" width="372" height="56" rx="10" fill="#151b26" stroke="#5ea8ff" stroke-width="2"/>
    <text x="710" y="362" text-anchor="middle" fill="#f2f5f9" font-size="18">That team's own queue</text>
    <line x1="710" y1="208" x2="710" y2="236" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="710" y1="296" x2="710" y2="324" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g class="legend">
    <rect x="40" y="432" width="28" height="18" rx="4" fill="#151b26" stroke="#f2994a" stroke-width="2"/>
    <text x="78" y="446" fill="#9aa5b6" font-size="14">Orange edge: the problem</text>
    <rect x="300" y="432" width="28" height="18" rx="4" fill="#151b26" stroke="#5ea8ff" stroke-width="2"/>
    <text x="338" y="446" fill="#9aa5b6" font-size="14">Blue edge: the fix</text>
  </g>
</svg>
