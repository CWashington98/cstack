<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="diagram-title diagram-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Template: steps over time, left to right on one line.
       Dots are 205 apart: x = 60, 265, 470, 675, 880. Dates sit above, steps below.
       Every color here comes from ../palette.json. -->
  <title id="diagram-title">What happens in the first week after sign-up</title>
  <desc id="diagram-desc">A timeline of five steps over seven days. Day 1: sign up and the welcome email. Day 3: the first reminder. Day 5: a check-in call. Day 7: the first report, which the person waits for.</desc>
  <rect x="0" y="0" width="960" height="320" fill="#0b0f17"/>

  <text x="40" y="56" fill="#f2f5f9" font-size="24" font-weight="600">What happens in the first week after sign-up</text>

  <line x1="40" y1="170" x2="920" y2="170" stroke="#6c788c" stroke-width="2"/>

  <g>
    <text x="60" y="140" text-anchor="middle" fill="#9aa5b6" font-size="15">Day 1</text>
    <circle cx="60" cy="170" r="9" fill="#5ea8ff"/>
    <text x="60" y="208" text-anchor="middle" fill="#f2f5f9" font-size="17" font-weight="600">Sign up</text>
  </g>
  <g>
    <text x="265" y="140" text-anchor="middle" fill="#9aa5b6" font-size="15">Day 1</text>
    <circle cx="265" cy="170" r="9" fill="#5ea8ff"/>
    <text x="265" y="208" text-anchor="middle" fill="#f2f5f9" font-size="17" font-weight="600">Welcome email</text>
  </g>
  <g>
    <text x="470" y="140" text-anchor="middle" fill="#9aa5b6" font-size="15">Day 3</text>
    <circle cx="470" cy="170" r="9" fill="#5ea8ff"/>
    <text x="470" y="208" text-anchor="middle" fill="#f2f5f9" font-size="17" font-weight="600">First reminder</text>
  </g>
  <g>
    <text x="675" y="140" text-anchor="middle" fill="#9aa5b6" font-size="15">Day 5</text>
    <circle cx="675" cy="170" r="9" fill="#5ea8ff"/>
    <text x="675" y="208" text-anchor="middle" fill="#f2f5f9" font-size="17" font-weight="600">Check-in call</text>
  </g>
  <g>
    <text x="880" y="140" text-anchor="middle" fill="#9aa5b6" font-size="15">Day 7</text>
    <circle cx="880" cy="170" r="11" fill="#202837" stroke="#5ea8ff" stroke-width="3"/>
    <text x="880" y="208" text-anchor="middle" fill="#f2f5f9" font-size="17" font-weight="600">First report</text>
  </g>

  <text x="40" y="280" fill="#9aa5b6" font-size="15">Filled dots are done automatically. The ringed dot is the step the person waits for.</text>
</svg>
