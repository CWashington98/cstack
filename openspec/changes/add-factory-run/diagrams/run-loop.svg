<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" role="img" aria-labelledby="diagram-title diagram-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="diagram-title">How one approved spec becomes merge-ready pull requests</title>
  <desc id="diagram-desc">The owner approves a spec. A model drafts the slices and a script checks them. The script picks one next step at a time: a fresh builder builds a slice, checks run, then two reviews. Findings go back to a fresh fixer at most twice. A merge-ready pull request waits for the owner to merge, and the script moves to the next slice. When it cannot go on, it stops and names who acts next.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c788c"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2994a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5ea8ff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="470" fill="#0b0f17"/>

  <text x="40" y="52" fill="#f2f5f9" font-size="24" font-weight="600">How one approved spec becomes merge-ready pull requests</text>

  <g>
    <rect x="40" y="110" width="196" height="96" rx="10" fill="#202837" stroke="#c49bff" stroke-width="2"/>
    <text x="138" y="152" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Owner approves</text>
    <text x="138" y="178" text-anchor="middle" fill="#9aa5b6" font-size="15">before any work</text>
  </g>
  <g>
    <rect x="280" y="110" width="196" height="96" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="378" y="152" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Slices checked</text>
    <text x="378" y="178" text-anchor="middle" fill="#9aa5b6" font-size="15">no task left out</text>
  </g>
  <g>
    <rect x="520" y="110" width="196" height="96" rx="10" fill="#151b26" stroke="#3ccbd3" stroke-width="2"/>
    <text x="618" y="152" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Script picks step</text>
    <text x="618" y="178" text-anchor="middle" fill="#9aa5b6" font-size="15">from saved state</text>
  </g>
  <g>
    <rect x="760" y="110" width="196" height="96" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="858" y="152" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Fresh builder</text>
    <text x="858" y="178" text-anchor="middle" fill="#9aa5b6" font-size="15">one slice, short brief</text>
  </g>
  <g>
    <rect x="1000" y="110" width="196" height="96" rx="10" fill="#151b26" stroke="#6c788c" stroke-width="2"/>
    <text x="1098" y="152" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Checks, reviews</text>
    <text x="1098" y="178" text-anchor="middle" fill="#9aa5b6" font-size="15">of this exact commit</text>
  </g>
  <g>
    <rect x="1000" y="300" width="196" height="96" rx="10" fill="#202837" stroke="#5ea8ff" stroke-width="2"/>
    <text x="1098" y="342" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Merge-ready</text>
    <text x="1098" y="368" text-anchor="middle" fill="#9aa5b6" font-size="15">pull request waits</text>
  </g>
  <g>
    <rect x="760" y="300" width="196" height="96" rx="10" fill="#202837" stroke="#c49bff" stroke-width="2"/>
    <text x="858" y="342" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Owner merges</text>
    <text x="858" y="368" text-anchor="middle" fill="#9aa5b6" font-size="15">the script never does</text>
  </g>
  <g>
    <rect x="280" y="300" width="196" height="96" rx="10" fill="#151b26" stroke="#f2994a" stroke-width="2"/>
    <text x="378" y="342" text-anchor="middle" fill="#f2f5f9" font-size="18" font-weight="600">Stops</text>
    <text x="378" y="368" text-anchor="middle" fill="#9aa5b6" font-size="15">says who acts next</text>
  </g>

  <line x1="236" y1="158" x2="276" y2="158" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="476" y1="158" x2="516" y2="158" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="716" y1="158" x2="756" y2="158" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="956" y1="158" x2="996" y2="158" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1098" y1="206" x2="1098" y2="296" stroke="#5ea8ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="1000" y1="348" x2="960" y2="348" stroke="#6c788c" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M1040,300 C1040,250 640,250 640,212" fill="none" stroke="#5ea8ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="900" y="282" text-anchor="middle" fill="#5ea8ff" font-size="15">next slice</text>

  <line x1="580" y1="206" x2="440" y2="296" stroke="#f2994a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>

  <path d="M1098,110 C1098,80 858,80 858,104" fill="none" stroke="#f2994a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
  <text x="978" y="70" text-anchor="middle" fill="#f2994a" font-size="15">findings: fresh fixer, twice at most</text>

  <g class="legend">
    <line x1="40" y1="440" x2="72" y2="440" stroke="#5ea8ff" stroke-width="2"/>
    <text x="82" y="445" fill="#9aa5b6" font-size="14">Blue: the way forward</text>
    <line x1="270" y1="440" x2="302" y2="440" stroke="#f2994a" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="312" y="445" fill="#9aa5b6" font-size="14">Orange dashes: back a step, or stop</text>
    <rect x="600" y="432" width="16" height="16" rx="3" fill="#202837" stroke="#c49bff" stroke-width="2"/>
    <text x="626" y="445" fill="#9aa5b6" font-size="14">Purple edge: the owner acts</text>
  </g>
</svg>
